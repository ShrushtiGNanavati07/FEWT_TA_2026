<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
</head>

<body>

    <table border="0" style="background-color: rgb(24, 67, 93);  text-align: center; margin-top: 80px; margin-left: 290px; border-radius: 22px; padding: 15px; box-shadow: 10px 10px 5px rgb(181, 225, 236);">

        <tr>
            <td colspan="4"><input type="text" id="mytext" style="margin-top: 7px; margin-bottom: 10px;"></td>
        </tr>

        <tr>
            <td><button onclick="AC()">AC</button></td>
            <td><button onclick="backspace()"><-</button></td>
            <td><button onclick="appendText('%')">%</button></td>
            <td><button onclick="appendText('/')">/</button></td>
        </tr>
        <tr>
            <td><button onclick="appendText('7')">7</button></td>
            <td><button onclick="appendText('8')">8</button></td>
            <td><button onclick="appendText('9')">9</button></td>
            <td><button onclick="appendText('*')">*</button></td>
        </tr>
        <tr>
            <td><button onclick="appendText('4')">4</button></td>
            <td><button onclick="appendText('5')">5</button></td>
            <td><button onclick="appendText('6')">6</button></td>
            <td><button onclick="appendText('-')">-</button></td>
        </tr>
        <tr>
            <td><button onclick="appendText('1')">1</button></td>
            <td><button onclick="appendText('2')">2</button></td>
            <td><button onclick="appendText('3')">3</button></td>
            <td><button onclick="appendText('+')">+</button></td>
        </tr>
        <tr>
            <td><button onclick="appendText('00')">00</button></td>
            <td><button onclick="appendText('0')">0</button></td>
            <td><button onclick="appendText('.')">.</button></td>
            <td><button onclick="finalans()">=</button></td>
        </tr>
    </table>

    <script>
        function appendText(op){
            document.getElementById("mytext").value += op;
        }

        function backspace(){
            exp = document.getElementById("mytext").value;                 // a  b  c  d  e       slice(start index , last index)--> last - 1 sudhi jai
            finalAns = exp.slice(0,-1);                                   // 0  1  2  3  4       slice(0,exo.length) --> badhu string ma store kari chi aetale
           document.getElementById("mytext").value = finalAns;            //-5  -4 -3 -2 -1      slice(0,-1)--> same output as above
        }

        function AC(){
            document.getElementById("mytext").value = '';
        }

        function finalans(){
            exp = document.getElementById("mytext").value;
            document.getElementById("mytext").value = eval(exp);  // eval() by default badha mathemetical expression solve kari de
        }

    </script>
    
</body>
</html>
