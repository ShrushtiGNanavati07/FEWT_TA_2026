<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scientific Calculator</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body{
            background-color: #f4f4f4;
        }

        .calculator{
            width: 350px;
            margin: 50px auto;
            padding: 20px;
            border-radius: 15px;
            background: white;
            box-shadow: 0px 0px 10px gray;
        }

        input{
            height: 60px;
            font-size: 25px !important;
            text-align: right;
        }

        button{
            width: 100%;
            height: 60px;
            font-size: 20px !important;
        }
    </style>
</head>

<body>

    <div class="calculator">

        <h2 class="text-center mb-3">Scientific Calculator</h2>

        <input type="text" id="result" class="form-control mb-3" readonly>

        <div class="row g-2">

            <div class="col-3">
                <button class="btn btn-secondary" onclick="clearScreen()">C</button>
            </div>

            <div class="col-3">
                <button class="btn btn-warning" onclick="deleteLast()">⌫</button>
            </div>

            <div class="col-3">
                <button class="btn btn-info" onclick="appendValue('(')">(</button>
            </div>

            <div class="col-3">
                <button class="btn btn-info" onclick="appendValue(')')">)</button>
            </div>

            <div class="col-3">
                <button class="btn btn-primary" onclick="appendValue('7')">7</button>
            </div>

            <div class="col-3">
                <button class="btn btn-primary" onclick="appendValue('8')">8</button>
            </div>

            <div class="col-3">
                <button class="btn btn-primary" onclick="appendValue('9')">9</button>
            </div>

            <div class="col-3">
                <button class="btn btn-danger" onclick="appendValue('/')">/</button>
            </div>

            <div class="col-3">
                <button class="btn btn-primary" onclick="appendValue('4')">4</button>
            </div>

            <div class="col-3">
                <button class="btn btn-primary" onclick="appendValue('5')">5</button>
            </div>

            <div class="col-3">
                <button class="btn btn-primary" onclick="appendValue('6')">6</button>
            </div>

            <div class="col-3">
                <button class="btn btn-danger" onclick="appendValue('*')">*</button>
            </div>

            <div class="col-3">
                <button class="btn btn-primary" onclick="appendValue('1')">1</button>
            </div>

            <div class="col-3">
                <button class="btn btn-primary" onclick="appendValue('2')">2</button>
            </div>

            <div class="col-3">
                <button class="btn btn-primary" onclick="appendValue('3')">3</button>
            </div>

            <div class="col-3">
                <button class="btn btn-danger" onclick="appendValue('-')">-</button>
            </div>

            <div class="col-3">
                <button class="btn btn-primary" onclick="appendValue('0')">0</button>
            </div>

            <div class="col-3">
                <button class="btn btn-primary" onclick="appendValue('.')">.</button>
            </div>

            <div class="col-3">
                <button class="btn btn-success" onclick="calculate()">=</button>
            </div>

            <div class="col-3">
                <button class="btn btn-danger" onclick="appendValue('+')">+</button>
            </div>

            <!-- Scientific Buttons -->

            <div class="col-4">
                <button class="btn btn-dark" onclick="scientific('sin')">sin</button>
            </div>

            <div class="col-4">
                <button class="btn btn-dark" onclick="scientific('cos')">cos</button>
            </div>

            <div class="col-4">
                <button class="btn btn-dark" onclick="scientific('tan')">tan</button>
            </div>

            <div class="col-4">
                <button class="btn btn-dark" onclick="scientific('sqrt')">√</button>
            </div>

            <div class="col-4">
                <button class="btn btn-dark" onclick="scientific('pow')">x²</button>
            </div>

            <div class="col-4">
                <button class="btn btn-dark" onclick="scientific('log')">log</button>
            </div>

        </div>

    </div>

<script>

    function appendValue(value){
        document.getElementById("result").value += value;
    }

    function clearScreen(){
        document.getElementById("result").value = "";
    }

    function deleteLast(){
        let current = document.getElementById("result").value;
        document.getElementById("result").value = current.slice(0,-1);
    }

    function calculate(){
        let result = document.getElementById("result");

        try{
            result.value = eval(result.value);
        }
        catch{
            result.value = "Error";
        }
    }

    function scientific(operation){

        let result = document.getElementById("result");
        let value = parseFloat(result.value);

        switch(operation){

            case "sin":
                result.value = Math.sin(value);
                break;

            case "cos":
                result.value = Math.cos(value);
                break;

            case "tan":
                result.value = Math.tan(value);
                break;

            case "sqrt":
                result.value = Math.sqrt(value);
                break;

            case "pow":
                result.value = Math.pow(value,2);
                break;

            case "log":
                result.value = Math.log10(value);
                break;
        }
    }

</script>

</body>
</html>
