<!-- WAP in JavaScript to find factorial of given number -->

<!DOCTYPE html>
<html>
<head>
    <title>Factorial Program</title>
</head>

<body>

<script>

     num = parseInt(prompt("Enter Number:"));

     fact = 1;

    for(i=1; i<=num; i++)
    {
        fact = fact * i;
    }

    alert("Factorial = " + fact);

</script>

</body>
</html>
