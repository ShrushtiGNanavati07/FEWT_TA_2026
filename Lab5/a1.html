<!-- demonstrate the use of array to find max number -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<script>

    n = parseInt(prompt("Enter the size of an array"));
    arr = [n];

    for(i=0; i<n; i++){
        arr[i] = parseInt(prompt("Enter element"));
    }

    max = arr[0];

    for(i=0; i<n; i++){
        if(arr[i] > max){
            max = arr[i];
        }
    }

    document.writeln("Array : ",arr);
    document.write("<br/>");
    document.write("Max number : ",max);

    // 5,4,9,1
    // i=0 ---> (5>5)no_swap  then max = 5 
    // i=1 ----> (4>5)? then max =5
    // i=2 ---->(9> 5)? then max =9
    // i=3 ----> (1>9)>  then max =9
    //Therefore max is 9
</script>
<body>
    
</body>
</html>
