<!--READ ARRAY FROM USER AND SORT THEM IN ASSENDING ORDER.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A2</title>
</head>
<body>
    <script>

        n = parseInt(prompt("Enter the size of an array "));

        arr =[n];
        for(i=0;i<n;i++){
            arr[i] = parseInt(prompt("Enter the element "+i+"th element: "));
        }
        document.write("Array : ",arr);
        
        for(i=0;i<n-1;i++){
            for(j=i+1;j<n;j++){
                if(arr[i]>arr[j]){
                    //swap the numbers
                    temp=arr[i];
                    arr[i]=arr[j];
                    arr[j]=temp;
                }
            }
        }
        document.write("<br>Assending order array is = "+arr);


        // 5,4,9,1
        //i=0,j=1 ---> 4,5,9,1
        //i=0 j=2 ---> 4,5,9,1
        //i=0 j=3 ---> 1,5,9,4

        //i=1 j=2 ---> 1,5,9,4
        //i=1 j=3 ---> 1,4,9,5
        

        //i=2 j=3 ---> 1,4,5,9

    </script>
    
</body>
</html>
