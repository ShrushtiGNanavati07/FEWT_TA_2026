<!--read arry from user and and sort them using bubble sort.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A3</title>
</head>
<body>
    <script>

        n = parseInt(prompt("Enter the size of an array "));

        arr = [];

        for(i=0;i<n;i++){
            arr[i] = parseInt(prompt("Enter the element "+i+"th element: "));
        }
        document.write("Array is = "+arr);

        for(i=0;i<n-1;i++){
            for(j=0;j<n-i-1;j++){

                if(arr[j]>arr[j+1]){
                    //swap
                    temp=arr[j]; 
                    arr[j]=arr[j+1];
                    arr[j+1]=temp;
                }
            }
        }

        document.write("<br>Sorted array using bubble sort : "+arr);

        //5 3 8 1
        //Pass 1
        //5 3 1 8

        //Pass 2
        //3 1 5 8

        //Pass 3
        //1 3 5 8


    </script>
    
</body>
</html>
