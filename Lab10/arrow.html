<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arrow Function</title>
</head>
<body>
    <script>

        x = () => {
            console.log("Hello")
        }
        x()
        
        y = (a) => {
            return a*2
        }
        console.log(y(4))

        y = (a,b) => {
            return a*b
        }
        console.log(y(4,5))

        z = a => {
            return a*2
        }
        console.log(z(4))

        z = a => a*2
        console.log(z(5))

        x = (a,b) => a*b
        console.log(x(10,5))
        

// () => expression

// param => expression

// (param) => expression

// (param1, paramN) => expression

// () => {
//   statements
// }

// param => {
//   statements
// }

// (param1, paramN) => {
//   statements
// }
    </script>
</body>
</html>
