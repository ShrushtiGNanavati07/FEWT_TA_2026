<!-- WAP to display students stored in array.-->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>3</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
 </head>
  <body>
    
    <script>

        arr = [
            {
                Name : "Ram",
                Age : 17,
                SPI : 9.8,
                Branch : "computer"
            },
             {
                Name : "Ramesh",
                Age : 18,
                SPI : 9.8,
                Branch : "computer"
            },
             {
                Name : "Mahesh",
                Age : 17,
                SPI : 9.8,
                Branch : "computer"
            },
             {
                Name : "Meera",
                Age : 18,
                SPI : 9.8,
                Branch : "computer"
            },
             {
                Name : "Rutvi",
                Age : 19,
                SPI : 9.8,
                Branch : "computer"
            }
        ];

    document.write("<table class='table'>");

        document.write("<thead class='table table-dark'>");
            document.write("<th>Name</th>");
            document.write("<th>Age</th>");
            document.write("<th>SPI</th>");
            document.write("<th>Branch</th>");
        document.write("</thead>");

        for(i=0;i<arr.length;i++){
            document.write("<tr class='table table-success'>");
                document.write("<td>",arr[i].Name,"</td>");
                document.write("<td>",arr[i].Age,"</td>");
                document.write("<td>",arr[i].SPI,"</td>");
                document.write("<td>",arr[i].Branch,"</td>");
            document.write("</tr>");
        }


    document.write("</table>");

    </script>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
