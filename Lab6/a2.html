<!-- Demonstrate different array functions like push, pop, shift, unshift, splice, sort etc…-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2</title>
</head>
<body>
    <script>

        arr = [1,2,3,40,5,6,9,8];

        

        arr.push(7);
        document.write("push method :-",arr);

        arr.pop();
        document.write("<br>pop method :-",arr);

        arr.shift();
        document.write("<br>shift method :-",arr);

        arr.unshift("hello ");
        b =  arr.unshift("hello ");
        document.write("<br>unshift method :-",arr);
        document.write("<br>unshift method length :-",b);


        a = arr.slice(1,4);
        document.write("<br>slice method :-",a);

        arr.splice(1,3);
        document.write("<br>splice method :-",arr);

        arr.sort();
        document.write("<br>sort method :-",arr);



        

    </script>
    
</body>
</html>
