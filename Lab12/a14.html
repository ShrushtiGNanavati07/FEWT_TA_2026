<!-- write a jQuery program to set background of an input element to red when in focus and back to white when not in focus.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>6</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
</head>
<body>
    <lable>Name :- </lable>
    <input type="text">
    <lable>AGE :- </lable>
    <input type="text">
    

    <script>
        
        $('input').focus(function (){
            $(this).css({
                backgroundColor : 'red'
            });
        })

         $('input').blur(function (){
            $(this).css({
                backgroundColor : 'white'
            });
        })

    </script>
  
</body>
</html>
