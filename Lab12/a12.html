<!--  write a jQuery program to change background color of all input tags when clicked on a button (-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>12</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
</head>
<body>
    <button id="btn">Click</button>
    <input type="text">
     <input type="text">

    <script>
       $('#btn').click(function (){

        $('input').css({
            backgroundColor : 'red',
            color : 'white'
        })
       })
    </script>
  
</body>
</html>
