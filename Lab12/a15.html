<!--  write a jQuery program to set background of an element to red when mouse enter on all paragraphs -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>7</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
</head>
<body>
    
    <p id="mypara">Lorem ipsum dolor sit amet consectetur, adipisicing elit. Alias accusantium praesentium soluta architecto est repellendus illo dolorum voluptates cum consequuntur nemo exercitationem molestias dolores, veniam similique error recusandae! Adipisci, eveniet.</p>

    <script>

        $('#mypara').mouseenter(function (){
            $(this).css({
                backgroundColor : 'red',
                color : 'white'
            });
        })

        $('#mypara').mouseout(function (){
            $(this).css({
                backgroundColor : 'white',
                color : 'black'
            });
        })
        
    </script>
  
</body>
</html>
