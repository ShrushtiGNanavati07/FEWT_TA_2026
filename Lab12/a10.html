<!--write a jQuery program to hide all elements with class "myEle" when clicked on a button-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
</head>
<body>
    <button id="btn">Click</button>
    <p class="myEle">Hello World</p>
    <p class="myEle">How are you??</p>

    <script>
        $('#btn').click(function (){
            $('.myEle').hide();
        })
    </script>
  
</body>
</html>
