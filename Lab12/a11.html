<!--write a jQuery program to toggle hide/show element with id "myEle" when clicked on a button. -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>11</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
</head>
<body>
    <button id="btn">Click</button>
    <p id="myEle">Hello World</p>

    <script>

        isvisible=true;

        $('#btn').click(function (){

            if(isvisible){
                $('#myEle').hide();
            }
            else{
                $('#myEle').show();
            }
            isvisible = !isvisible;
        })

        //  $('#btn').click(function (){
        //     $('#myEle').toggle();
        // })
        
    </script>
  
</body>
</html>
