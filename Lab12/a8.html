<!--write a jQuery to hide all siblings when clicked on a button.-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>8</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>

</head>
<body>

    <button id="btn">Click</button>

    <div id="parent">
        <p>Hello world</p>
        <p>How are you ??</p>

        <div id="subparent">
            <p>Subparent</p>
            <p>hyyy</p>
        </div>
    </div>

    <script>
        $(document).ready(function (){
            $('#btn').click(function (){
                $('#subparent').siblings().hide();
            })
        })
    </script>
</body>
</html>
