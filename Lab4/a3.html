<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A3</title>
</head>
<body>
    <script>
        n = parseInt(prompt("Enter the size"));
        for(i=0;i<n;i++){
            for(j=0;j<=i;j++){
            document.write("*");
            }
            document.writeln("</br>");
        }

        document.writeln("<br/>");
        
        for(i=n;i>=1;i--){
            for(j=1;j<=i;j++){
                document.write(j," ");
            }
            document.write("</br>");
        }
    </script>
    
</body>
</html>
