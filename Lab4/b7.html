<!-- take string from user and find char 'a' and return the index of a-->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>B7</title>
</head>
<body>
    <script>
        a = (prompt("Enter the string"));
        firstindex = a.indexOf('a');
        lastindex = a.lastIndexOf('a');

        str = a.substring(firstindex+1,lastindex);
        document.write("First index = "+firstindex);
        document.write("Last index = "+lastindex);
        document.write("String = ",str);
    </script>
    
</body>
</html>
